    <script>
        // Logika Hamburger Menu
        const navToggle = document.getElementById('navToggle');
        const navLinks = document.getElementById('navLinks');

        if (navToggle && navLinks) {
            navToggle.addEventListener('click', () => {
                const isOpen = navLinks.classList.toggle('open');
                navToggle.classList.toggle('open', isOpen);
                navToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            });

            navLinks.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    navLinks.classList.remove('open');
                    navToggle.classList.remove('open');
                    navToggle.setAttribute('aria-expanded', 'false');
                });
            });
        }
    </script>

    <!-- =======================================================
         MUSIK GLOBAL (persist antar halaman via localStorage)
         Blok ini SAMA PERSIS di semua halaman (index, skills,
         languages, projects, dll) supaya posisi lagu & status
         mute/unmute nyambung terus walau pindah halaman.
         ======================================================= -->
    <script>
        const bgMusic = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicToggleBtn');
        const muteIndicator = document.getElementById('muteIndicator');
        const tapHint = document.getElementById('tapHint');

        const START_TIME_SECONDS = 70; // start default (kunjungan pertama) dari menit 1:10
        const LS_TIME_KEY = 'lb_music_time';
        const LS_UNMUTED_KEY = 'lb_music_unmuted';

        let audioUnmuted = false;

        bgMusic.muted = true;
        bgMusic.volume = 1;

        function startAutoplay() {
            const playPromise = bgMusic.play();
            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    // Autoplay ke-block total, musik akan mulai begitu
                    // user klik ikonnya secara manual.
                });
            }
        }

        function goUnmuted() {
            bgMusic.muted = false;
            audioUnmuted = true;
            localStorage.setItem(LS_UNMUTED_KEY, '1');
            if (bgMusic.paused) startAutoplay();
            musicBtn.setAttribute('aria-label', 'Jeda musik');
            if (muteIndicator) muteIndicator.style.display = 'none';
            if (tapHint) tapHint.style.display = 'none';
        }

        function setStartTimeAndPlay() {
            const savedTime = parseFloat(localStorage.getItem(LS_TIME_KEY));
            try {
                bgMusic.currentTime = !isNaN(savedTime) && savedTime > 0 ? savedTime : START_TIME_SECONDS;
            } catch (e) {
                // kalau gagal (browser belum siap), abaikan
            }
            startAutoplay();

            // Kalau di halaman sebelumnya user udah pernah nyalain suara,
            // langsung coba unmute otomatis di halaman ini juga.
            if (localStorage.getItem(LS_UNMUTED_KEY) === '1') {
                goUnmuted();
            }
        }

        if (bgMusic.readyState >= 1) {
            setStartTimeAndPlay();
        } else {
            bgMusic.addEventListener('loadedmetadata', setStartTimeAndPlay, { once: true });
        }

        function unmuteOnFirstInteraction() {
            if (!audioUnmuted) {
                goUnmuted();
            }
            document.removeEventListener('click', unmuteOnFirstInteraction);
            document.removeEventListener('touchstart', unmuteOnFirstInteraction);
            document.removeEventListener('keydown', unmuteOnFirstInteraction);
            document.removeEventListener('scroll', unmuteOnFirstInteraction);
        }

        document.addEventListener('click', unmuteOnFirstInteraction);
        document.addEventListener('touchstart', unmuteOnFirstInteraction);
        document.addEventListener('keydown', unmuteOnFirstInteraction);
        document.addEventListener('scroll', unmuteOnFirstInteraction, { passive: true });

        // Ikon muter cuma pas musik beneran lagi main
        bgMusic.addEventListener('play', () => musicBtn.classList.add('playing'));
        bgMusic.addEventListener('pause', () => musicBtn.classList.remove('playing'));

        // Klik ikon = toggle play/pause manual
        musicBtn.addEventListener('click', () => {
            if (bgMusic.paused) {
                bgMusic.play();
            } else {
                bgMusic.pause();
            }
        });

        // Simpan posisi lagu secara berkala + pas mau pindah halaman
        let lastSaved = 0;
        bgMusic.addEventListener('timeupdate', () => {
            const now = Date.now();
            if (now - lastSaved > 1500) {
                lastSaved = now;
                localStorage.setItem(LS_TIME_KEY, String(bgMusic.currentTime));
            }
        });
        window.addEventListener('pagehide', () => {
            localStorage.setItem(LS_TIME_KEY, String(bgMusic.currentTime));
        });
    </script>
